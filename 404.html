<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Stackly</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./css/404.css">
</head>

<body>

    <main class="error-page">

        <!-- =========================
             STACKLY LOGO
        ========================== -->
        <a href="index.html" class="logo">
            <span class="logo-name">STACKLY</span>
        </a>


        <!-- =========================
             404 CONTENT
        ========================== -->
        <section class="error-content">

            <div class="error-number">
                404
            </div>


            <h1>
                Page not found
            </h1>


            <p>
                The link may be old or mistyped. Go back to where
                <br class="desktop-break">
                you were, or start again from the home page.
            </p>


            <!-- =========================
                 ACTION BUTTONS
            ========================== -->
            <div class="error-buttons">

                <!-- Always goes to index.html -->
                <button
                    type="button"
                    class="error-btn home-btn"
                    id="backHomeBtn"
                >
                    <span>Back to home</span>
                    <span class="arrow">→</span>
                </button>


                <!-- Returns to previous page -->
                <button
                    type="button"
                    class="error-btn go-back-btn"
                    id="goBackBtn"
                >
                    <span>Go back</span>
                    <span class="arrow">←</span>
                </button>

            </div>

        </section>

    </main>


    <script src="./js/404.js"></script>

</body>
</html>
